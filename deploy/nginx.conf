limit_req_zone $binary_remote_addr zone=ashrayam_contact:10m rate=5r/m;
server {
    listen 80;
    server_name ashrayam.com www.ashrayam.com;
    client_max_body_size 16k;
    location = /contact {
        limit_req zone=ashrayam_contact burst=3 nodelay;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
